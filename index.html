<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div>
                <h1>🌦️ Weather Dashboard</h1>
                <p>Check the weather of any city</p>
            </div>
            <button id="themeBtn">🌙 Dark Mode</button>
        </header>

        <form id="searchForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >
            <button type="submit" id="searchBtn">Search</button>
        </form>

        <div id="recentSearches"></div>

        <p id="message"></p>

        <main id="weatherContainer" class="hidden">

            <section class="current-weather">

                <div class="weather-heading">
                    <div>
                        <h2 id="cityName">City Name</h2>
                        <p id="weatherDate"></p>
                    </div>
                    <button id="unitBtn">°C / °F</button>
                </div>

                <div class="temperature-section">
                    <span id="weatherIcon">🌤️</span>
                    <h1 id="temperature">--°C</h1>
                </div>

                <h3 id="condition">Weather Condition</h3>
                <p id="feelsLike">Feels like: --°C</p>

                <div class="details">
                    <div class="detail-card">
                        <h3>💨 Wind Speed</h3>
                        <p id="windSpeed">-- km/h</p>
                    </div>

                    <div class="detail-card">
                        <h3>💧 Humidity</h3>
                        <p id="humidity">--%</p>
                    </div>

                    <div class="detail-card">
                        <h3>🌧️ Precipitation</h3>
                        <p id="precipitation">-- mm</p>
                    </div>
                </div>

            </section>

            <section class="forecast-section">
                <h2>📅 5-Day Forecast</h2>
                <div id="forecastContainer" class="forecast-grid"></div>
            </section>

        </main>

        <footer>
            <p>Made with ❤️ using HTML, CSS and JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
